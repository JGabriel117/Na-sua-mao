{% extends "base.html" %}
{% block titulo %}Entrar - Na sua mão{% endblock %}

{% block conteudo %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl shadow-sm px-8 py-10">
    <h1 class="text-center text-2xl font-extrabold text-indigo-600">Na sua mão</h1>
    <p class="text-center text-sm text-gray-500 mt-1">Entre para gerenciar suas locações</p>

    {% if erro %}
      <div class="mt-6 rounded-xl bg-red-50 border border-red-100 text-red-700 text-sm px-4 py-3">{{ erro }}</div>
    {% endif %}

    <form method="post" action="/login" class="mt-7 space-y-5">
      <input type="hidden" name="proximo" value="{{ proximo or '/painel' }}">
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-800 mb-2">E-mail ou CPF</label>
        <input id="email" name="email" type="text" value="{{ email or '' }}" required
               class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm text-gray-800 placeholder-gray-400">
      </div>
      <div>
        <label for="senha" class="block text-sm font-semibold text-gray-800 mb-2">Senha</label>
        <input id="senha" name="senha" type="password" required
               class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm text-gray-800">
      </div>
      <div class="text-right -mt-1">
        <a href="/recuperar-senha" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Esqueci minha senha</a>
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 rounded-lg transition">
        Entrar
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Não tem conta? <a href="/cadastro" class="text-indigo-600 font-semibold hover:text-indigo-700">Cadastre-se</a>
    </p>
  </div>
</div>
{% endblock %}
