{% extends "base.html" %}
{% block titulo %}Cadastrar administrador - Na sua mão{% endblock %}

{% block conteudo %}
<div class="max-w-lg mx-auto px-4 py-12">
  <div class="bg-white border border-gray-100 rounded-2xl shadow-sm px-8 py-9">
    <p class="text-center text-sm font-bold text-indigo-600">Na sua mão</p>
    <h1 class="text-center text-2xl font-extrabold text-gray-900 mt-2">Novo administrador</h1>
    <p class="text-center text-sm text-gray-500 mt-2">Acesso restrito a gestores autenticados.</p>

    {% if erro %}
      <div class="mt-6 rounded-xl bg-red-50 border border-red-100 text-red-700 text-sm px-4 py-3">{{ erro }}</div>
    {% endif %}

    <form method="post" action="/admin/cadastrar" class="mt-7 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-800 mb-2">Nome Completo</label>
        <input name="nome" required value="{{ form.nome if form else '' }}"
               class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-800 mb-2">E-mail Institucional</label>
        <input name="email" type="email" required value="{{ form.email if form else '' }}"
               class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-800 mb-2">CPF</label>
        <input name="cpf" required maxlength="14" placeholder="000.000.000-00" value="{{ form.cpf if form else '' }}"
               class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm placeholder-gray-400">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-800 mb-2">Senha Provisória</label>
        <input name="senha" type="password" required placeholder="Mínimo 6 caracteres"
               class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm placeholder-gray-400">
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 rounded-lg transition">
        Cadastrar administrador
      </button>
    </form>
  </div>
</div>
{% endblock %}
